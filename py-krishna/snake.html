<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #111, #1e1e1e);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    .game-container {
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 42px;
    }

    #score {
      font-size: 24px;
      margin-bottom: 12px;
    }

    canvas {
      background: #222;
      border: 5px solid white;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .controls {
      margin-top: 14px;
      font-size: 16px;
      opacity: 0.9;
    }

    #restartBtn {
      margin-top: 14px;
      padding: 10px 22px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: limegreen;
      color: white;
      cursor: pointer;
      display: none;
      transition: 0.2s;
    }

    #restartBtn:hover {
      transform: scale(1.05);
      background: green;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>🐍 Snake Game</h1>
    <div id="score">Score: 0</div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="controls">
      Use Arrow Keys or WASD to move
    </div>

    <button id="restartBtn">Restart Game</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const gridSize = 25;
    const tileCount = canvas.width / gridSize;

    let snake;
    let velocityX;
    let velocityY;
    let food;
    let score;
    let gameLoop;

    function startGame() {
      snake = [
        { x: 10, y: 10 }
      ];

      velocityX = 1;
      velocityY = 0;

      score = 0;
      document.getElementById('score').innerText = 'Score: 0';

      placeFood();

      document.getElementById('restartBtn').style.display = 'none';

      clearInterval(gameLoop);
      gameLoop = setInterval(drawGame, 90);
    }

    function placeFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
    }

    document.addEventListener('keydown', changeDirection);

    function changeDirection(e) {
      const key = e.key.toLowerCase();

      if ((key === 'arrowup' || key === 'w') && velocityY !== 1) {
        velocityX = 0;
        velocityY = -1;
      }
      else if ((key === 'arrowdown' || key === 's') && velocityY !== -1) {
        velocityX = 0;
        velocityY = 1;
      }
      else if ((key === 'arrowleft' || key === 'a') && velocityX !== 1) {
        velocityX = -1;
        velocityY = 0;
      }
      else if ((key === 'arrowright' || key === 'd') && velocityX !== -1) {
        velocityX = 1;
        velocityY = 0;
      }
    }

    function drawGame() {
      // Background
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Move snake
      const head = {
        x: snake[0].x + velocityX,
        y: snake[0].y + velocityY
      };

      // Wall collision
      if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= tileCount ||
        head.y >= tileCount
      ) {
        endGame();
        return;
      }

      // Self collision
      for (let part of snake) {
        if (head.x === part.x && head.y === part.y) {
          endGame();
          return;
        }
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById('score').innerText = 'Score: ' + score;
        placeFood();
      } else {
        snake.pop();
      }

      // Draw food
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2.5,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Draw snake
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? '#7CFC00' : '#32CD32';

        ctx.fillRect(
          segment.x * gridSize,
          segment.y * gridSize,
          gridSize - 2,
          gridSize - 2
        );
      });
    }

    function endGame() {
      clearInterval(gameLoop);

      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'white';
      ctx.font = '48px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);

      ctx.font = '24px Arial';
      ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 45);

      document.getElementById('restartBtn').style.display = 'inline-block';
    }

    document.getElementById('restartBtn').addEventListener('click', startGame);

    startGame();
  </script>
</body>
</html>
